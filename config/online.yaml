%YAML:1.0

dataset: "realsense"

# 相机参数 - 只需要基本内参
image_width: 640
image_height: 480
camera_fx: 451.08
camera_fy: 600.34
camera_cx: 322.26
camera_cy: 240.60

Mapping:
  # 实例分割参数
  voxel_length: 0.02
  sdf_trunc: 0.04
  min_voxel_weight: 0.1

  # 深度处理参数
  depth_scale: 1000.0
  depth_max: 4.0

  # 关联参数
  min_det_masks: 60
  min_active_points: 50
  max_box_area_ratio: 0.9
  query_depth_vx_size: -1.0
  dilate_kernal: 2
  min_iou: 0.3
  search_radius: 3.0

  # 合并参数
  merge_inflation: 3.0
  merge_iou: 0.3
  realtime_merge_floor: 1
  recent_window_size: 240
  update_period: 20

  # 贝叶斯融合
  bayesian_semantic_likelihood: "/home/wuxin/Desktop/FM-Fusion/measurement_model/bayesian_model.txt"

  # 导出参数
  shape_min_points: 300
  save_da_dir: ""

Graph:
  edge_radius_ratio: 2.0
  voxel_size: 0.02
  involve_floor_edge: 1
  ignore_labels: "ceiling."

SGNet:
  triplet_number: 20
  instance_match_threshold: 0.05
  warm_up: 10

ShapeEncoder:
  init_voxel_size: 0.05
  init_radius: 0.0625
  padding: "random"
  K_shape_samples: 768
  K_match_samples: 96

LoopDetector:
  fuse_shape: 1
  lcd_nodes: 3
  recall_nodes: 2

Registration:
  noise_bound: 1.0

# 输出设置
save_da_images: 0
tmp_dir: "/tmp/my_camera_output"